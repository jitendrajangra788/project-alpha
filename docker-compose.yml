services:
  db:
    image: postgis/postgis:16-3.4
    container_name: careconnect-db
    environment:
      POSTGRES_DB: careconnect
      POSTGRES_USER: careconnect
      POSTGRES_PASSWORD: careconnect
    ports:
      - "5432:5432"
    volumes:
      - careconnect_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careconnect -d careconnect"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: careconnect-redis
    ports:
      - "6379:6379"
    volumes:
      - careconnect_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  careconnect_pgdata:
  careconnect_redis:
