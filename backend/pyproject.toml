[project]
name = "careconnect-api"
version = "1.0.0"
description = "CareConnect FastAPI backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "sqlalchemy[asyncio]==2.0.36",
  "asyncpg==0.30.0",
  "psycopg[binary]==3.2.3",
  "alembic==1.14.0",
  "pydantic==2.10.3",
  "pydantic-settings==2.6.1",
  "email-validator==2.2.0",
  "python-jose[cryptography]==3.3.0",
  "passlib[bcrypt]==1.7.4",
  "bcrypt==4.2.1",
  "redis==5.2.1",
  "python-multipart==0.0.20",
  "httpx==0.28.1",
  "aiofiles==24.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.24.0",
  "aiosqlite==0.20.0",
]

[tool.vercel]
# ASGI app object: module path relative to backend/
entrypoint = "app.main:app"

[tool.vercel.scripts]
build = "python -c \"print('CareConnect FastAPI ready')\""
